<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/customer/dashboard.css}">
</head>
<body>
<div class="wrapper">
<div th:replace="~{customer/fragments/header :: header}"></div>
<div class="container">
    <!-- Thông báo nạp tiền thành công -->
    <div th:if="${topupStatus == 'success' and topupAmount != null}" 
         style="background: #d1fae5; border: 1px solid #10b981; border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 24px;">✅</span>
            <div>
                <strong style="color: #065f46; font-size: 16px;">Nạp tiền thành công!</strong>
                <p style="margin: 4px 0 0; color: #047857; font-size: 14px;">
                    Bạn đã nạp thành công <strong th:text="${#numbers.formatDecimal(topupAmount, 0, 'COMMA', 0, 'NONE')} + ' VND'">0 VND</strong> vào ví.
                </p>
            </div>
        </div>
        <button onclick="this.parentElement.style.display='none'" 
                style="background: none; border: none; font-size: 20px; cursor: pointer; color: #065f46; padding: 0 8px;">&times;</button>
    </div>
    
    <!-- Thông báo lỗi nạp tiền -->
    <div th:if="${topupStatus == 'error' and topupErrorMessage != null}" 
         style="background: #fee2e2; border: 1px solid #ef4444; border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 24px;">❌</span>
            <div>
                <strong style="color: #991b1b; font-size: 16px;">Lỗi nạp tiền</strong>
                <p style="margin: 4px 0 0; color: #b91c1c; font-size: 14px;" th:text="${topupErrorMessage}">Có lỗi xảy ra</p>
            </div>
        </div>
        <button onclick="this.parentElement.style.display='none'" 
                style="background: none; border: none; font-size: 20px; cursor: pointer; color: #991b1b; padding: 0 8px;">&times;</button>
    </div>
    
    <h2 class="title">Feature License</h2>

    <section class="grid" id="productGrid" >
        <!-- Loop qua danh sách products -->
        <a class="card clickable"
           th:each="p : ${products}"
           th:if="${p.status == 'public'}"
           th:href="@{'/product/' + ${p.productId}}">

            <div class="thumb">
                <!-- Badge Out of Stock -->
                <span th:if="${p.quantity != null and p.quantity <= 0}"
                      class="badge-out">Out of Stock</span>

                <!-- Badge Sale -->
                <span th:if="${p.salePrice != null and p.salePrice < p.price}"
                      class="badge-sale">SALE</span>

                <!-- Tìm và hiển thị ảnh của product này -->
                <img th:each="img : ${productImages}"
                     th:if="${img.productId == p.productId}"
                     th:src="${img.imageUrl != null && !img.imageUrl.isEmpty() ? img.imageUrl : '/img/avatar_default.jpg'}"
                     th:alt="${p.name}"
                     onerror="this.onerror=null;this.src='/img/avatar_default.jpg';"
                     loading="lazy">

            </div>

            <div class="body">
                <!-- Tên sản phẩm -->
                <div class="title" th:text="${p.name}">Product Title</div>

                <!-- Rating và số lượng đã bán -->
                <div class="meta">
                <span class="rating">⭐
                    <span th:text="${p.averageRating}">4.5</span>
                </span>
                    <span class="sales">• Sold:
                    <span th:text="${p.totalSales != null ? p.totalSales : 0}">0</span>
                </span>
                </div>

                <!-- Giá -->
                <div class="price">
                    <!-- Nếu có giá sale -->
                    <span th:if="${p.salePrice != null and p.salePrice < p.price}">
                    <span th:text="${#numbers.formatDecimal(p.salePrice, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                    <span class="price-original">
                        <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                    </span>
                </span>
                    <!-- Nếu không có giá sale -->
                    <span th:unless="${p.salePrice != null and p.salePrice < p.price}">
                    <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                </span>
                </div>
            </div>
        </a>
    </section>
</div>
</div>
</body>
</html>
