<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/customer/dashboard.css}">
    <script th:src="@{/js/customer/dashboard.js}" defer></script>
</head>
<body>
<div class="wrapper">
<div th:replace="~{customer/fragments/header :: header}"></div>
<div class="container">
    <!-- Thông báo nạp tiền thành công -->
    <div th:if="${topupStatus == 'success' and topupAmount != null}" 
         class="topup-notification topup-notification-success">
        <div class="topup-notification-content">
            <span class="topup-notification-icon">✅</span>
            <div class="topup-notification-text">
                <strong class="topup-notification-title">Nạp tiền thành công!</strong>
                <p class="topup-notification-message">
                    Bạn đã nạp thành công <strong th:text="${#numbers.formatDecimal(topupAmount, 0, 'COMMA', 0, 'NONE')} + ' VND'">0 VND</strong> vào ví.
                </p>
            </div>
        </div>
        <button class="topup-notification-close" type="button">&times;</button>
    </div>
    
    <!-- Thông báo lỗi nạp tiền -->
    <div th:if="${topupStatus == 'error' and topupErrorMessage != null}" 
         class="topup-notification topup-notification-error">
        <div class="topup-notification-content">
            <span class="topup-notification-icon">❌</span>
            <div class="topup-notification-text">
                <strong class="topup-notification-title">Lỗi nạp tiền</strong>
                <p class="topup-notification-message" th:text="${topupErrorMessage}">Có lỗi xảy ra</p>
            </div>
        </div>
        <button class="topup-notification-close" type="button">&times;</button>
    </div>
    
    <h2 class="title">Feature License</h2>

    <section class="grid" id="productGrid" >
        <!-- Loop qua danh sách products -->
        <a class="card clickable"
           th:each="p : ${products}"
           th:if="${p.status == 'public'}"
           th:href="@{'/product/' + ${p.productId}}">

            <div class="thumb">
                <!-- Badge Out of Stock -->
                <span th:if="${p.quantity != null and p.quantity <= 0}"
                      class="badge-out">Out of Stock</span>

                <!-- Badge Sale -->
                <span th:if="${p.salePrice != null and p.salePrice < p.price}"
                      class="badge-sale">SALE</span>

                <!-- Tìm và hiển thị ảnh của product này -->
                <img th:each="img : ${productImages}"
                     th:if="${img.productId == p.productId}"
                     th:src="${img.imageUrl != null && !img.imageUrl.isEmpty() ? img.imageUrl : '/img/avatar_default.jpg'}"
                     th:alt="${p.name}"
                     loading="lazy"
                     data-fallback="/img/avatar_default.jpg">

            </div>

            <div class="body">
                <!-- Tên sản phẩm -->
                <div class="title" th:text="${p.name}">Product Title</div>

                <!-- Rating và số lượng đã bán -->
                <div class="meta">
                <span class="rating">⭐
                    <span th:text="${p.averageRating}">4.5</span>
                </span>
                    <span class="sales">• Sold:
                    <span th:text="${p.totalSales != null ? p.totalSales : 0}">0</span>
                </span>
                </div>

                <!-- Giá -->
                <div class="price">
                    <!-- Nếu có giá sale -->
                    <span th:if="${p.salePrice != null and p.salePrice < p.price}">
                    <span th:text="${#numbers.formatDecimal(p.salePrice, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                    <span class="price-original">
                        <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                    </span>
                </span>
                    <!-- Nếu không có giá sale -->
                    <span th:unless="${p.salePrice != null and p.salePrice < p.price}">
                    <span th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'NONE')} + ' đ'"></span>
                </span>
                </div>
            </div>
        </a>
    </section>
</div>
</div>
</body>
</html>
