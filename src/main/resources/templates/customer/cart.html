<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/css/styles.min.css">
    <title>Shopping Cart</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #6b7280;
            --brand: #0ea5e9;
            --chip: #e5e7eb;
            --line: #eaeef4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        .wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }


        .wrap {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 10px
        }

        .cart-card {
            background: #fff;
            border: 1px solid #eaeef4;
            border-radius: 12px;
            overflow: hidden
        }

        .cart-header,
        .cart-row {
            display: grid;
            grid-template-columns: 40px 1fr 120px 160px 120px 120px;
            align-items: center
        }

        .cart-header {
            background: #f9fafb;
            color: #111827;
            font-weight: 600
        }

        .col {
            padding: 12px;
            border-bottom: 1px solid #eaeef4
        }

        .col.center {
            text-align: center
        }

        .col.right {
            text-align: right
        }

        .prod {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .thumb {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            overflow: hidden;
            background: #f3f4f6;
            display: grid;
            place-items: center
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .name {
            font-weight: 600;
            color: #111827
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .qty-pill {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #111827;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            white-space: nowrap
        }

        .muted {
            color: #6b7280;
            font-size: 12px
        }

        .qty {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center
        }

        .qty input {
            width: 58px;
            padding: 6px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            text-align: center
        }

        .errmsg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #eaeef4;
            background: #fff;
            cursor: pointer
        }

        .btn.danger {
            border-color: #fecaca;
            background: #fee2e2;
            color: #b91c1c
        }

        .btn.primary {
            background: #0ea5e9;
            color: #fff;
            border: none
        }

        .btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .summary {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            align-items: center;
            padding: 12px
        }

        .total {
            font-size: 18px;
            font-weight: 800;
            color: #111827
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div th:replace="~{customer/fragments/header :: header}"></div>
        
        <div class="wrap">
        <h2>Shopping Cart</h2>
        <div id="toast"
            style="display:none;position:fixed;top:16px;right:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:9999">
        </div>
        <div class="cart-card">
            <div class="cart-header">
                <div class="col center"><input type="checkbox" disabled></div>
                <div class="col">Product</div>
                <div class="col center">Unit Price</div>
                <div class="col center">Quantity</div>
                <div class="col right">Amount</div>
                <div class="col center">Actions</div>
            </div>
            <div class="cart-row" th:each="it : ${items}">
                <div class="col center"><input type="checkbox" class="item-checkbox" checked 
                    th:attr="data-product-id=${it.product.productId}"></div>
                <div class="col">
                    <div class="prod">
                        <div class="thumb"><img th:if="${it.image != null}" th:src="${it.image}"
                                onerror="this.onerror=null;this.src='/img/avatar_default.jpg'" alt=""></div>
                        <div style="width:100%">
                            <div class="name-row">
                                <div class="name" th:text="${it.product.name}">Tên</div>
                                <span class="qty-pill" th:text="${'x' + it.quantity}">x1</span>
                            </div>
                            <div class="muted">Stock: <b th:text="${it.stock}">0</b></div>
                            <div class="muted">Code: <span th:text="${it.product.productId}">1</span></div>
                            <div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                                <input type="text" 
                                    th:attr="id=${'voucher-input-' + it.product.productId}, 
                                             data-product-id=${it.product.productId}"
                                    placeholder="Voucher code" 
                                    style="height:28px;padding:0 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:12px;width:120px">
                                <button type="button" 
                                    th:attr="data-product-id=${it.product.productId}, 
                                             onclick=${'applyVoucher(' + it.product.productId + ')'}"
                                    class="btn" 
                                    style="height:28px;padding:0 10px;font-size:12px;background:#111827;color:#fff;border:none">Apply</button>
                                <span th:if="${it.appliedVoucher != null}" 
                                    style="font-size:11px;color:#10b981;font-weight:600"
                                    th:text="${'✓ ' + it.appliedVoucher}">✓ CODE</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col center"><span
                        th:text="${#numbers.formatDecimal(it.unitPrice,0,'COMMA',0,'POINT')}">0</span>₫</div>
                <div class="col center">
                    <div class="qty">
                        <input type="number" min="1" th:value="${it.quantity}"
                            th:attr="data-product-id=${it.product.productId}" class="qty-input">
                    </div>
                    <div class="errmsg" th:attr="id=${'err-' + it.product.productId}"></div>
                </div>
                <div class="col right">
                    <div th:if="${it.discount != null and it.discount > 0}" 
                        style="font-size:11px;color:#10b981;text-decoration:line-through">
                        <span th:text="${#numbers.formatDecimal(it.lineTotal,0,'COMMA',0,'POINT')}">0</span>₫
                    </div>
                    <div style="font-weight:600">
                        <span th:text="${#numbers.formatDecimal((it.finalPrice != null ? it.finalPrice : it.lineTotal),0,'COMMA',0,'POINT')}">0</span>₫
                    </div>
                </div>
                <div class="col center">
                    <a class="btn danger remove-btn" th:href="@{'/cart/remove'(productId=${it.product.productId})}"
                        th:attr="data-product-id=${it.product.productId}">Remove</a>
                </div>
            </div>
            <div th:if="${items == null or #lists.isEmpty(items)}" class="col" style="color:#6b7280;text-align:center">
                Cart is empty.</div>
        </div>
        <script>
            (function () {
                function getCheckboxes() {
                    return document.querySelectorAll('.item-checkbox');
                }
                
                function hasCheckedItem() {
                    const checkboxes = getCheckboxes();
                    return Array.from(checkboxes).some(cb => cb.checked);
                }
                
                const inputs = document.querySelectorAll('.qty-input');
                const totalEl = document.querySelector('.total span');
                const checkoutBtn = document.getElementById('checkout-btn');
                
                function updateCheckoutButton() {
                    const hasChecked = hasCheckedItem();
                    if (checkoutBtn) {
                        checkoutBtn.disabled = !hasChecked;
                        if (!hasChecked) {
                            checkoutBtn.style.opacity = '0.5';
                            checkoutBtn.style.cursor = 'not-allowed';
                            checkoutBtn.style.pointerEvents = 'none';
                        } else {
                            checkoutBtn.style.opacity = '1';
                            checkoutBtn.style.cursor = 'pointer';
                            checkoutBtn.style.pointerEvents = 'auto';
                        }
                    }
                }
                
                window.hasCheckedItemForCheckout = function() {
                    if (!hasCheckedItem()) {
                        alert('Vui lòng chọn ít nhất một sản phẩm để thanh toán');
                        return false;
                    }
                    return true;
                };
                
                const checkoutForm = document.getElementById('checkout-form');
                if (checkoutForm) {
                    checkoutForm.addEventListener('submit', function(e) {
                        if (!hasCheckedItem()) {
                            e.preventDefault();
                            e.stopPropagation();
                            alert('Vui lòng chọn ít nhất một sản phẩm để thanh toán');
                            return false;
                        }
                    });
                }
                
                const checkboxes = getCheckboxes();
                checkboxes.forEach(cb => {
                    cb.addEventListener('change', () => {
                        recomputeTotals();
                    });
                });
                
                function recomputeTotals() {
                    let sum = 0;
                    document.querySelectorAll('.cart-row').forEach(function (row) {
                        const checkbox = row.querySelector('.item-checkbox');
                        if (!checkbox || !checkbox.checked) return;
                        
                        const priceText = row.querySelector('.col.center span')?.textContent?.replace(/\D/g, '') || '0';
                        const qtyInput = row.querySelector('.qty-input');
                        const price = parseInt(priceText || '0', 10);
                        const qty = parseInt(qtyInput?.value || '1', 10);
                        sum += (price * qty);
                        const lineEl = row.querySelector('.col.right span');
                        if (lineEl) {
                            lineEl.textContent = new Intl.NumberFormat('vi-VN').format(price * qty);
                        }
                    });
                    if (totalEl) {
                        totalEl.textContent = new Intl.NumberFormat('vi-VN').format(sum);
                    }
                    updateCheckoutButton();
                }
                
                inputs.forEach(inp => {
                    inp.addEventListener('change', () => {
                        const pid = inp.getAttribute('data-product-id');
                        let val = parseInt(inp.value || '1', 10);
                        if (!val || val < 1) val = 1;
                        
                        fetch('/cart/update', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: `productId=${encodeURIComponent(pid)}&quantity=${encodeURIComponent(val)}`
                        }).then(r => r.json()).then(d => {
                            const err = document.getElementById('err-' + pid);
                            if (d.over) {
                                err.textContent = `Exceeds stock (${d.stock}). Set to ${d.appliedQty}.`;
                            } else {
                                err.textContent = '';
                            }
                            inp.value = d.appliedQty;
                            const pill = inp.closest('.cart-row')?.querySelector('.qty-pill');
                            if (pill) pill.textContent = 'x' + d.appliedQty;
                            recomputeTotals();
                        }).catch(() => {});
                    });
                });

                document.querySelectorAll('.remove-btn').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const pid = a.getAttribute('data-product-id');
                        fetch('/cart/remove', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: `productId=${encodeURIComponent(pid)}`
                        }).then(r => r.json()).then(() => {
                            a.closest('.cart-row')?.remove();
                            recomputeTotals();
                        }).catch(() => {
                            window.location.href = '/cart/remove?productId=' + encodeURIComponent(pid);
                        });
                    });
                });
                
                recomputeTotals();
                updateCheckoutButton();
            })();
            
            function applyVoucher(productId) {
                const input = document.getElementById('voucher-input-' + productId);
                const code = input?.value?.trim();
                if (!code) {
                    alert('Vui lòng nhập mã voucher');
                    return;
                }
                
                fetch('/cart/apply-voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `productId=${encodeURIComponent(productId)}&code=${encodeURIComponent(code)}`
                }).then(r => r.json()).then(d => {
                    if (d.ok) {
                        window.location.reload();
                    } else {
                        alert(d.error || 'Voucher không hợp lệ');
                    }
                }).catch(() => {
                    alert('Có lỗi xảy ra');
                });
            }
        </script>
        <div class="summary" style="flex-wrap:wrap;gap:10px;justify-content:flex-end">
            <div style="display:flex;align-items:center;gap:12px">
                <div class="total">Total: <span th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')}">0</span>₫</div>
                <a href="/customer/dashboard" class="btn">Continue Shopping</a>
                <form method="post" action="/cart/checkout-demo" id="checkout-form" style="display:inline">
                    <button class="btn primary" type="submit" id="checkout-btn" onclick="return hasCheckedItemForCheckout();">Pay with Balance</button>
                </form>
            </div>
        </div>
        </div>
    </div>
    
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const pay = params.get('pay');
            if (!pay) return;
            const toast = document.getElementById('toast');
            if (!toast) return;
            const show = (msg, bg) => { toast.textContent = msg; toast.style.background = bg; toast.style.display = 'block'; setTimeout(() => { toast.style.display = 'none'; }, 3500); };
            if (pay === 'success') show('Payment successful with balance.', '#065f46');
            else if (pay === 'insufficient') show('Insufficient balance. Please top up.', '#991b1b');
            else if (pay === 'empty') show('Cart is empty or invalid.', '#b45309');
            else if (pay === 'auth') show('Please login again.', '#1f2937');
        })();
    </script>
</body>

</html>
