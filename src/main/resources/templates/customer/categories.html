<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/customer/categories.css}">
</head>
<body>
<div th:replace="~{customer/fragments/header :: header}"></div>
<div class="container">
    <h1>All Categories</h1>

    <div class="categories-grid">
        <div class="category-card" th:each="category : ${categories}"
             th:if="${numberProductInCate[category.categoryId] != null and numberProductInCate[category.categoryId] > 0}">
            <a th:href="@{/category/{id}(id=${category.categoryId})}"
               style="text-decoration: none; color: inherit; display: block;">
                <div class="category-name" th:text="${category.name}">Graphics</div>
                <div class="category-description" th:text="${category.description}">Stock graphics, icons and vector art</div>
                <div class="product-count">
                    <span th:text="${numberProductInCate[category.categoryId]}">3</span>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
