<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Detail</title>
    <link rel="shortcut icon" th:href="@{/img/favicon.png}"/>
    <link rel="stylesheet" th:href="@{/css/styles.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* Căn chỉnh phần nội dung chính để không bị sidebar che */
        .content-wrapper {
            margin-left: 260px; /* Đẩy sang phải bằng độ rộng sidebar */
            padding: 30px;
            background-color: #f8f9fa;
            min-height: 100vh;
        }


        .user-header form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        table {
            background-color: white;
        }

        th {
            background-color: #6c8cff;
            color: white;
            text-align: center;
        }

        td, th {
            padding: 10px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f2f4ff;
        }

        tr:hover {
            background-color: #e5e8ff;
        }


        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }


        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }


        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            background-color: #fff;
        }

        /* Màu cho ô readonly */
        input[readonly], textarea[readonly],
        select[readonly] {
            background-color: #e9ecef;
            font-weight: bold;
            color: #555;
        }

        /* Cả hai nút chung */
        .submit-btn,
        .cancel-btn {
            padding: 12px 28px; /* to hơn */
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            background-color: #fff;
            min-width: 130px; /* cho 2 nút đều nhau */
        }

        /* Approve button (xanh lá) */
        .submit-btn {
            color: #28a745;
            border: 2px solid #1e7e34;
        }

        .submit-btn:hover {
            color: #fff;
            background-color: #28a745;
            border-color: #1e7e34;
            transform: scale(1.05); /* phóng nhẹ khi hover */
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.4);
        }

        /* Cancel button (đỏ) */
        .cancel-btn {
            color: #d9534f;
            border: 2px solid #b52b27;
        }

        .cancel-btn:hover {
            color: #fff;
            background-color: #d9534f;
            border-color: #b52b27;
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(217, 83, 79, 0.4);
        }

        .form-container {
            display: flex;
            justify-content: center; /* căn giữa ngang */
            align-items: center;
            gap: 35px; /* khoảng cách giữa hai form */
            margin-top: 20px;
        }

        .sidebar-item {
            position: relative;
            list-style: none;
        }

        .sidebar-item > ul {
            display: none;
            margin-left: 1.5rem;
        }

        .sidebar-item:hover > ul {
            display: block;
        }

        .badge {
            background-color: #dc3545;
            color: #fff;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full">
    <!-- Sidebar Start -->
    <div th:replace="~{admin/sidebar::sidebar}"></div>
    <!-- Sidebar End -->

    <!-- ListUser Section -->
    <div class="content-wrapper">
        <div th:if="${error}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Thông báo thành công -->
        <div th:if="${success}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <h2>Update</h2>


        <div class="form-group">
            <label>Product ID:</label>
            <input readonly type="text" name="productId" th:value="${product != null ? product.productId : ''}">
        </div>

        <div class="form-group">
            <label>Seller ID:</label>
            <input readonly type="text" name="sellerId" th:value="${product != null ? product.sellerId : ''}">
        </div>

        <div class="form-group">
            <label>Name:</label>
            <input readonly type="text" name="name" th:value="${product != null ? product.name : ''}">
        </div>

        <div class="form-group">
            <label>Description:</label>
            <textarea readonly name="description" rows="3"
                      th:text="${product != null ? product.description : ''}"></textarea>
        </div>

        <div class="form-group">
            <label>Price:</label>
            <input readonly type="number" step="0.01" name="price" th:value="${product != null ? product.price : ''}">
        </div>

        <div class="form-group">
            <label>Sale Price:</label>
            <input readonly type="number" step="0.01" name="salePrice"
                   th:value="${product != null ? product.salePrice : ''}">
        </div>

        <div class="form-group">
            <label>Quantity:</label>
            <input readonly type="number" name="quantity" th:value="${product != null ? product.quantity : ''}">
        </div>

        <div class="form-group">
            <label>Download URL:</label>
            <input readonly type="text" name="downloadUrl" th:value="${product != null ? product.downloadUrl : ''}">
        </div>

        <div class="form-group">
            <label>Total Sales:</label>
            <input readonly type="number" name="totalSales" th:value="${product != null ? product.totalSales : ''}">
        </div>

        <div class="form-group">
            <label>Average Rating:</label>
            <input readonly type="number" step="0.1" name="averageRating"
                   th:value="${product != null ? product.averageRating : ''}">
        </div>

        <div class="form-group">
            <label>Status:</label>
            <select readonly name="status" class="form-control">
                <option value="public"
                        th:selected="${product != null and #strings.equalsIgnoreCase(product.status,'public')}">Public
                </option>
                <option value="pending"
                        th:selected="${product != null and #strings.equalsIgnoreCase(product.status,'pending')}">Pending
                </option>
                <option value="hidden"
                        th:selected="${product != null and #strings.equalsIgnoreCase(product.status,'hidden')}">Hidden
                </option>
            </select>

        </div>

        <div class="form-group">
            <label>Created At:</label>
            <input readonly type="text" name="createdAt"
                   th:value="${product != null ? #temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm') : ''}">
        </div>

        <div class="form-group">
            <label>Updated At:</label>
            <input readonly type="text" name="updatedAt"
                   th:value="${product != null ? #temporals.format(product.updatedAt, 'yyyy-MM-dd HH:mm') : ''}">
        </div>
        <div class="form-container">
            <!-- Approve Form -->
            <form id="approveForm" th:action="@{/admin/product/update}" method="post" style="display:inline;">
                <input type="hidden" name="productId" th:value="${product.productId}">
                <button type="button" class="submit-btn btn-approve">Approve</button>
            </form>

            <!-- Cancel Form -->
            <form id="cancelForm" th:action="@{/admin/product/cancel}" method="post" style="display:inline;">
                <input type="hidden" name="productId" th:value="${product.productId}">
                <button type="button" class="cancel-btn btn-cancel">Cancel</button>
            </form>
        </div>
    </div>
</div>
<!-- Approve Confirmation Modal (Xanh lá) -->
<div class="modal fade" id="confirmApproveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="bi bi-check-circle-fill me-2"></i> Confirm Approval
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="fs-5 mb-2">Do you want to approve this product?</p>
                <p class="text-muted mb-0">It will be visible to all users.</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">No</button>
                <button type="button" class="btn btn-success px-4" id="confirmApproveBtn">Yes, Approve</button>
            </div>
        </div>
    </div>
</div>

<!-- Cancel Confirmation Modal (Đỏ + Lý do) -->
<div class="modal fade" id="confirmCancelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">
                    <i class="bi bi-exclamation-octagon-fill me-2"></i> Confirm Cancellation
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="fs-5 mb-2">Do you really want to cancel this product?</p>
                <p class="text-muted mb-3">This action cannot be undone.</p>

                <!-- Ô nhập lý do -->
                <div class="mb-3">
                    <label for="cancelReason" class="form-label text-start d-block fw-semibold">
                        Reason for cancellation <span class="text-danger">*</span>
                    </label>
                    <textarea class="form-control" id="cancelReason" rows="3" placeholder="Enter reason (required)"
                              required></textarea>
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">No, Keep</button>
                <button type="button" class="btn btn-danger px-4" id="confirmCancelBtn">Yes, Cancel</button>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // === Approve Modal (Không cần lý do) ===
        const approveModal = new bootstrap.Modal(document.getElementById('confirmApproveModal'));
        const confirmApproveBtn = document.getElementById('confirmApproveBtn');
        const approveForm = document.getElementById('approveForm');

        document.querySelectorAll('.btn-approve').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                approveModal.show();
            });
        });

        confirmApproveBtn.addEventListener('click', function () {
            approveForm.submit();
        });

        // === Cancel Modal (Có lý do) ===
        const cancelModal = new bootstrap.Modal(document.getElementById('confirmCancelModal'));
        const confirmCancelBtn = document.getElementById('confirmCancelBtn');
        const cancelForm = document.getElementById('cancelForm');
        const reasonInput = document.getElementById('cancelReason');

        document.querySelectorAll('.btn-cancel').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                reasonInput.value = ''; // Reset
                cancelModal.show();
            });
        });

        confirmCancelBtn.addEventListener('click', function () {
            const reason = reasonInput.value.trim();
            if (!reason) {
                alert('Please enter a reason for cancellation.');
                return;
            }

            // Thêm lý do vào form
            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'reason';
            hiddenInput.value = reason;
            cancelForm.appendChild(hiddenInput);

            cancelForm.submit();
        });

        // Focus vào textarea khi mở modal cancel
        cancelModal._element.addEventListener('shown.bs.modal', () => reasonInput.focus());
    });
</script>
<script th:src="@{/assets/libs/jquery/dist/jquery.min.js}"></script>
<script src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/libs/apexcharts/dist/apexcharts.min.js"></script>
<script src="../assets/libs/simplebar/dist/simplebar.js"></script>
<script src="../assets/js/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
